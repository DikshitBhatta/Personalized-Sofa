name: timberr
description: A furniture shopping app made using Flutter, Firebase and Getx state management.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.3.0
  get: ^4.6.6
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^17.2.2
  googleapis_auth: ^1.6.0
  timeago: ^3.6.1
  http: ^1.2.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  lottie: ^3.0.0
  url_launcher: ^6.2.4
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  model_viewer_plus: ^1.7.2
  shared_preferences: ^2.2.2
  path_provider: ^2.0.14
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.1.0
  google_maps_flutter: ^2.5.3
  intl: ^0.19.0

dependency_overrides:
  win32: ^5.5.0
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
  - assets/
  - assets/icon/
  - assets/icons/
  - assets/lottie/
  - assets/fonts/
  - assets/slider/
  - assets/3dmodel/
  - assets/fabrics/
  - assets/materials/pattern/
  - assets/materials/legs/
  - assets/materials/stetching/
  fonts:
  - family: NunitoSans
    fonts:
      - asset: assets/fonts/NunitoSans_Regular.ttf
      - asset: assets/fonts/NunitoSans_Light.ttf
        weight: 300
      - asset: assets/fonts/NunitoSans_SemiBold.ttf
        weight: 600
      - asset: assets/fonts/NunitoSans_Bold.ttf
        weight: 700
      - asset: assets/fonts/NunitoSans_ExtraBold.ttf
        weight: 800

  - family: Gelasio
    fonts:
      - asset: assets/fonts/Gelasio_Regular.ttf
      - asset: assets/fonts/Gelasio_Medium.ttf
        weight: 500
      - asset: assets/fonts/Gelasio_SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Gelasio_Bold.ttf
        weight: 700

  - family: Merriweather
    fonts:
      - asset: assets/fonts/Merriweather_Regular.ttf
      - asset: assets/fonts/Merriweather_Bold.ttf
        weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/mesofa.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  
  # No adaptive icon - uses standard icon only
  # This makes the icon appear larger and consistent
  
  # iOS configuration
  ios_content_mode: scaleAspectFit
